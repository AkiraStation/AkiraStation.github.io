<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
{% include base/head.html %}

<body>
  {% include base/nav.html %}

  <main id="main">
    {{ content }}
  </main>

  {% include base/footer.html %}
  {% include base/search.html %}

  <div class="asset-quality" data-asset-quality hidden>
    <button type="button" class="asset-quality-btn" aria-pressed="false"
            title="加载原始分辨率的图片（体积会明显变大）">加载完整资源</button>
  </div>

  <script src="{{ '/js/site.js' | relative_url }}" defer></script>

  {%- if site.service-worker %}
  <script src="{{ '/js/snackbar.js' | relative_url }}" defer></script>
  <script src="{{ '/js/sw-registration.js' | relative_url }}" defer></script>
  {%- endif %}
</body>

</html>

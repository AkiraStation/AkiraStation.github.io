# ============================================================
# 主页 / 全站文案与区块配置
# ------------------------------------------------------------
# 改主页内容只需要改这个文件，不必动模板。
# 站点由 GitHub Pages 经典构建（无自定义插件）生成，_data 是 Jekyll 原生功能。
# ============================================================

hero:
  eyebrow: "AkiraStation"
  title: "只剩下无尽的门扉"
  subtitle: "这里是 Akiras 的博客与画作的静态备份。项目、画作与文字，各自成列。"
  image: "/img/opt/default_header.jpg"
  # Hero 遮罩强度（0–1），配合深色主题使用
  mask: 0.55
  cta:
    - label: "浏览作品"
      url: "/projects/"
      style: "primary"
    - label: "阅读文字"
      url: "/fblogs/"
      style: "ghost"

# 主页项目区块的标题
projects_section:
  eyebrow: "Works"
  title: "项目与作品"
  subtitle: "周边、画作与实验。按类型或年份筛选。"

# 主页最近文章区块
recent_section:
  eyebrow: "Writing"
  title: "近作"
  subtitle: "随笔与补档长文"
  count: 4

# 画作横向图墙（按数组顺序展示，可自由增删）
# url 指向对应的项目详情页
gallery_section:
  eyebrow: "Gallery"
  title: "画作图墙"
  subtitle: "横向滑动查看更多"
  images:
    - src: "/img/opt/summer_compressed.jpg"
      caption: "浅滩之夏"
      url: "/2023/09/04/project_summer/"
    - src: "/img/opt/clog_compressed.jpg"
      caption: "纪念作"
      url: "/2020/01/01/project_clog/"
    - src: "/img/opt/bprint_compressed.jpg"
      caption: "蓝图垫"
      url: "/2024/05/06/project_blueprint/"
    - src: "/img/opt/tokenize_bb.jpg"
      caption: "代币"
      url: "/2025/10/29/project_token/"
    - src: "/img/opt/bcard_compressed.jpg"
      caption: "个人名片"
      url: "/2022/08/06/project_bcard/"

# 页脚标语
footer:
  tagline: "Therefore, you refused my connection."
  note: "静态备份 · 由 Jekyll 生成"

<!-- 搜索浮层：索引在首次打开时才 fetch，避免首屏额外请求 -->
<div class="search" data-search data-search-url="{{ '/search.json' | relative_url }}" aria-hidden="true" role="dialog" aria-modal="true" aria-label="站内搜索">
  <div class="search-panel">
    <input class="search-field" type="search" placeholder="搜索项目与文字…（Ctrl / ⌘ + K）"
           data-search-field autocomplete="off" aria-label="搜索关键词">
    <div class="search-results" data-search-results>
      <p class="search-empty">输入关键词开始搜索</p>
    </div>
  </div>
  <button class="search-close" type="button" data-search-close aria-label="关闭搜索">✕</button>
</div>

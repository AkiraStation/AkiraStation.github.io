{%- assign f = site.data.home.footer -%}
<footer class="site-footer">
  <div class="container">
    <div class="footer-inner">
      <div>
        <div class="footer-brand">{{ site.title }}</div>
        <p class="footer-meta">{{ f.tagline | default: site.description }}</p>
      </div>
      <nav class="footer-nav" aria-label="页脚导航">
        <a href="{{ '/' | relative_url }}">首页</a>
        <a href="{{ '/projects/' | relative_url }}">项目</a>
        <a href="{{ '/fblogs/' | relative_url }}">文字</a>
        <a href="{{ '/about/' | relative_url }}">关于</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </nav>
    </div>
    <div class="footer-copy">
      <span>© {{ site.time | date: '%Y' }} {{ site.title }}</span>
      <span>{{ f.note | default: 'Static site' }}</span>
    </div>
  </div>
</footer>

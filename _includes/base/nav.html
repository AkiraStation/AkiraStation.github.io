<a class="skip-link" href="#main">跳到主要内容</a>

<header class="site-header" data-site-header>
  <div class="container">
    <div class="site-nav">
      <a class="nav-brand" href="{{ '/' | relative_url }}">
        <span class="nav-brand-dot" aria-hidden="true"></span>
        {{ site.title }}
      </a>

      <nav class="nav-links" data-nav-links aria-label="主导航">
        {%- assign current = page.url | replace: 'index.html', '' -%}

        <a class="nav-link{% if current == '/' %} is-active{% endif %}" href="{{ '/' | relative_url }}">首页</a>
        <a class="nav-link{% if current contains '/projects/' %} is-active{% endif %}" href="{{ '/projects/' | relative_url }}">项目</a>
        <a class="nav-link{% if current contains '/fblogs/' %} is-active{% endif %}" href="{{ '/fblogs/' | relative_url }}">文字</a>
        <a class="nav-link{% if current contains '/about/' %} is-active{% endif %}" href="{{ '/about/' | relative_url }}">关于</a>
        <a class="nav-link{% if current contains '/misc/' %} is-active{% endif %}" href="{{ '/misc/' | relative_url }}">杂项</a>
      </nav>

      <button class="nav-search" type="button" data-search-open aria-label="搜索">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path>
        </svg>
      </button>

      <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="nav-links" aria-label="切换菜单">
        <span class="nav-toggle-bars" aria-hidden="true"></span>
      </button>
    </div>
  </div>
</header>
